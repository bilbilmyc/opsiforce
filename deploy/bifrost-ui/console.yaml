apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsiforce-bifrost-console
  namespace: opsiforce
spec:
  replicas: 1
  selector:
    matchLabels: {app: opsiforce-bifrost-console}
  template:
    metadata:
      labels: {app: opsiforce-bifrost-console}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: console
        image: sealos.hub:5000/opsiforce/bifrost-console:channel-onboarding-20260915-3
        ports:
        - {name: http, containerPort: 8080}
        readinessProbe:
          httpGet: {path: /console-health, port: http}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: opsiforce-bifrost-console
  namespace: opsiforce
spec:
  type: NodePort
  selector: {app: opsiforce-bifrost-console}
  ports:
  - {name: http, port: 8080, targetPort: http, nodePort: 38080}
