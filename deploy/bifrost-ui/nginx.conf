worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 8080;
    root /usr/share/nginx/html;
    client_max_body_size 100m;
    location = /console-health { return 200 'ok'; }
    location = /index.html { try_files $uri =404; add_header Cache-Control 'no-cache'; }
    location = / { try_files /index.html =404; add_header Cache-Control 'no-cache'; }
    location /assets/ { try_files $uri =404; }
    location ~ ^/(workspace|login|oauth/consent|agent/handover|pprof)(/|$) {
      try_files $uri /index.html;
      add_header Cache-Control 'no-cache';
    }
    location / {
      # API authentication, cookies and permissions remain enforced by Bifrost.
      proxy_pass http://opsiforce-bifrost:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
