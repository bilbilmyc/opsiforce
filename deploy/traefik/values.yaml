# Bare-metal test ingress. No domain, node IP parameter, or HTTPS redirect required.
image:
  registry: sealos.hub:5000
  repository: opsiforce/traefik
  tag: v3.7.13
deployment:
  kind: DaemonSet
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0
service:
  spec:
    type: ClusterIP
ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik
providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: false
  kubernetesIngress:
    enabled: true
    ingressClass: traefik
ports:
  web:
    port: 8000
    hostPort: 80
    exposedPort: 80
    transport:
      respondingTimeouts:
        readTimeout: 3600s
        writeTimeout: 0s
        idleTimeout: 3600s
  websecure:
    port: 8443
    hostPort: 443
    exposedPort: 443
    transport:
      respondingTimeouts:
        readTimeout: 3600s
        writeTimeout: 0s
        idleTimeout: 3600s
api:
  dashboard: false
ingressRoute:
  dashboard:
    enabled: false
log:
  level: INFO
accessLog:
  enabled: true
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
