# Test entry: reuse the platform's existing routing and test identity configuration.
# Put company authentication in front of the management platform before public use.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: opsiforce-http
  namespace: opsiforce
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      priority: 1
      services:
        - name: opsiforce-edge
          port: 8080
