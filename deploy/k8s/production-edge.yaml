# Production integration endpoint: private ClusterIP, no standalone login provider or public ingress.
apiVersion: v1
kind: ConfigMap
metadata:
  name: opsiforce-edge
  namespace: opsiforce
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    events { worker_connections 10240; }
    http {
      client_max_body_size 0;
      client_body_timeout 3600s;
      send_timeout 3600s;
      client_header_buffer_size 128k;
      large_client_header_buffers 4 128k;
      map $http_upgrade $connection_upgrade { default upgrade; '' close; }
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto ${PUBLIC_SCHEME};
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
      server {
        listen 8080 default_server;
        server_name _;
        location = /healthz { access_log off; return 200 'ok'; }
        location = /runtime-config.js {
          default_type application/javascript;
          add_header Cache-Control "no-store";
          return 200 'window.__OPSIFORCE_CONFIG__={"domain":"${DOMAIN}","scheme":"${PUBLIC_SCHEME}"};';
        }
        location /api/gateway { return 403; }
        location /api/external-services/agent { return 403; }
        location /api/internal { return 403; }
        location /api/code/ { proxy_pass http://opsiforce-proxy-vscode:3003; }
        location /api/db/ { proxy_pass http://opsiforce-proxy-db:3004; }
        location /api/proxy { proxy_pass http://opsiforce-proxy-agent:3005; }
        location /api { proxy_pass http://opsiforce-backend:3001; }
        location / { proxy_pass http://opsiforce-frontend:8080; }
      }
      server {
        listen 8080;
        server_name ~^[a-f0-9-]+\.code\.${DOMAIN_REGEX}$;
        location / { proxy_pass http://opsiforce-proxy-vscode:3003; }
      }
      server {
        listen 8080;
        server_name ~^[a-f0-9-]+\.db\.${DOMAIN_REGEX}$;
        location / { proxy_pass http://opsiforce-proxy-db:3004; }
      }
      server {
        listen 8080;
        server_name ~^[a-f0-9-]+\.preview\.apps\.${DOMAIN_REGEX}$;
        location / { proxy_pass http://opsiforce-proxy-app:3002; }
      }
      server {
        listen 8080;
        server_name ~^[a-z0-9-]+\.apps\.${DOMAIN_REGEX}$;
        location / { proxy_pass http://opsiforce-proxy-app:3002; }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: opsiforce-edge
  namespace: opsiforce
spec:
  selector:
    app: opsiforce-edge
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsiforce-edge
  namespace: opsiforce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opsiforce-edge
  template:
    metadata:
      labels:
        app: opsiforce-edge
      annotations:
        opsiforce.io/release: '${RELEASE_ID}'
    spec:
      automountServiceAccountToken: false
      containers:
      - name: nginx
        image: '${REGISTRY}/nginx:1.28.0-alpine'
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 20
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          failureThreshold: 60
        volumeMounts:
        - name: nginx
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: nginx
        configMap:
          name: opsiforce-edge
