apiVersion: v1
kind: Service
metadata:
  name: opsiforce-backend
  namespace: opsiforce
spec:
  selector:
    app: opsiforce-backend
  ports:
  - name: http
    port: 3001
    targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsiforce-backend
  namespace: opsiforce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opsiforce-backend
  template:
    metadata:
      labels:
        app: opsiforce-backend
      annotations:
        opsiforce.io/release: '${RELEASE_ID}'
    spec:
      automountServiceAccountToken: true
      containers:
      - name: backend
        image: ${REGISTRY}/opsiforce-backend:${TAG}
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3001
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 20
        startupProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 10
          failureThreshold: 60
        envFrom:
        - configMapRef:
            name: opsiforce-backend
        - secretRef:
            name: opsiforce-secrets
        volumeMounts:
        - name: workspace
          mountPath: /workspace-data
      serviceAccountName: opsiforce-backend
      terminationGracePeriodSeconds: 180
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: opsiforce-workspaces
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: opsiforce-frontend
  namespace: opsiforce
spec:
  selector:
    app: opsiforce-frontend
  ports:
