    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsiforce-frontend
  namespace: opsiforce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opsiforce-frontend
  template:
    metadata:
      labels:
        app: opsiforce-frontend
      annotations:
        opsiforce.io/release: '${RELEASE_ID}'
    spec:
      automountServiceAccountToken: false
      containers:
      - name: frontend
        image: ${REGISTRY}/opsiforce-frontend:${TAG}
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 20
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          failureThreshold: 60
