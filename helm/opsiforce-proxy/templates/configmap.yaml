apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opsiforce-proxy.fullname" . }}
data:
  nginx.conf: |
    user nginx;
    worker_processes  1;
    events {
      worker_connections  10240;
    }
    http {
      client_max_body_size 5m;

      client_header_buffer_size 128k;
      large_client_header_buffers 4 128k;

      {{- if .Values.appProxy.previewAppsHostname }}
      server {
          listen       80;
          server_name  ~^[a-f0-9-]+\.{{ .Values.appProxy.previewAppsHostname | replace "." "\\." }}$;
          location / {
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_pass http://{{ .Values.appProxy.backendService }}:3002;
          }
      }
      {{- end }}

      server {
          listen       80;
          server_name  ~^[a-f0-9-]+\.{{ .Values.vscodeProxy.appsHostname | replace "." "\\." }}$;
          location / {
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_pass http://{{ .Values.vscodeProxy.backendService }}:3003;
          }
      }

      server {
          listen       80;
          server_name  ~^[a-f0-9-]+\.{{ .Values.dbProxy.appsHostname | replace "." "\\." }}$;
          location / {
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_pass http://{{ .Values.dbProxy.backendService }}:3004;
          }
      }

      server {
          listen       80 default_server;
          server_name  _;
          location = /healthz {
            access_log off;
            return 200 'ok';
          }
          location /api/gateway {
            return 403;
          }
          location /api/proxy {
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_pass {{ .Values.proxy.agentService }};
          }
          location /api {
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_pass {{ .Values.proxy.backendService }};
          }
          location / {
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_pass {{ .Values.proxy.frontendService }};
          }
      }
    }
