replicaCount: 1

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: ""

proxy:
  agentService:
  backendService:
  frontendService:

oauth2Proxy:
  image:
  clientId:
  cookieSecret:
  cookieDomain:
  clientSecret:
  issuerUrl:
  logoutUrl:
  redirectUrl:
  redisPath:

imagePullSecrets:
  - name: ghcr-pull-secret
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false

ingressRoute:
  enabled: true
  hostname: opsiforce.dev.opsima.com
  traefikTarget: traefik.traefik.1d27b1e1-ef9f-407a-889a-6d80fc8fdd07.northamerica-central-1a.cfke.cloudfleet.dev
  certResolver: letsencrypt

appProxy:
  backendService: ""
  backendPort: "3002"
  appsHostname: apps.dev.opsima.com
  previewAppsHostname: preview.apps.dev.opsima.com

vscodeProxy:
  backendService: ""
  appsHostname: code.dev.opsima.com

dbProxy:
  backendService: ""
  appsHostname: db.dev.opsima.com

bifrostDashboard:
  enabled: true
  serviceName: ""
  hostname: bifrost.dev.opsima.com

resources:
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
readinessProbe:
  httpGet:
    path: /healthz
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: cfke.io/region
              operator: In
              values:
                - northamerica
            - key: cfke.io/subregion
              operator: In
              values:
                - east
            - key: node.kubernetes.io/instance-type
              operator: NotIn
              values:
                - cpx11
                - cpx21
                - cpx22
                - cpx32
                - ccx13
                - cx23
                - cx33
