apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "opsiforce.serviceAccountName" . }}
  labels:
    {{- include "opsiforce.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "opsiforce.fullname" . }}-pod-manager
  labels:
    {{- include "opsiforce.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["traefik.io"]
    resources: ["middlewares", "ingressroutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "opsiforce.fullname" . }}-pod-manager
  labels:
    {{- include "opsiforce.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "opsiforce.fullname" . }}-pod-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "opsiforce.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
