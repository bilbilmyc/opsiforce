apiVersion: v1
kind: Service
metadata:
  name: {{ include "opsiforce-bifrost.fullname" . }}
  labels:
    {{- include "opsiforce-bifrost.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.containerPort }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "opsiforce-bifrost.selectorLabels" . | nindent 4 }}
