apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opsiforce-bifrost.fullname" . }}
  labels:
    {{- include "opsiforce-bifrost.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "opsiforce-bifrost.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: {{ .Values.containerPort }}
          protocol: TCP
