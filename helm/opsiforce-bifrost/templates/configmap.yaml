apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opsiforce-bifrost.fullname" . }}-config
  labels:
    {{- include "opsiforce-bifrost.labels" . | nindent 4 }}
data:
  config.json: |
    {
      "providers": {
        "openai": {
          "keys": [
            { "name": "openai-primary", "value": "env.OPENAI_API_KEY" }
          ]
        }
      },
      "config_store": {
        "enabled": true,
        "type": "postgres",
        "config": {
          "connection_url": "env.DATABASE_URL"
        }
      },
      "log_store": {
        "enabled": true,
        "type": "postgres",
        "config": {
          "connection_url": "env.DATABASE_URL"
        }
      },
      "plugins": {
        "governance": { "enabled": true },
        "logging": { "enabled": true }
      },
      "auth": {
        "master_key": "env.MASTER_KEY"
      }
    }
