{{- if or .Values.config.openaiApiKey .Values.config.bifrostMasterKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opsiforce-backend.fullname" . }}-secret
  labels:
    {{- include "opsiforce-backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.config.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.config.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.config.bifrostMasterKey }}
  BIFROST_MASTER_KEY: {{ .Values.config.bifrostMasterKey | quote }}
  {{- end }}
{{- end }}
