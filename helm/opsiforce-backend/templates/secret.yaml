{{- if or .Values.config.openaiApiKey .Values.config.bifrostAdminUsername .Values.config.bifrostAdminPassword .Values.config.mailgunApiKey .Values.config.proxyControlToken .Values.config.oidcPluginSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opsiforce-backend.fullname" . }}-secret
  labels:
    {{- include "opsiforce-backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.config.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.config.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.config.bifrostAdminUsername }}
  BIFROST_ADMIN_USERNAME: {{ .Values.config.bifrostAdminUsername | quote }}
  {{- end }}
  {{- if .Values.config.bifrostAdminPassword }}
  BIFROST_ADMIN_PASSWORD: {{ .Values.config.bifrostAdminPassword | quote }}
  {{- end }}
  {{- if .Values.config.mailgunApiKey }}
  MAILGUN_API_KEY: {{ .Values.config.mailgunApiKey | quote }}
  {{- end }}
  {{- if .Values.config.proxyControlToken }}
  PROXY_CONTROL_TOKEN: {{ .Values.config.proxyControlToken | quote }}
  {{- end }}
  {{- if .Values.config.oidcPluginSecret }}
  OIDC_PLUGIN_SECRET: {{ .Values.config.oidcPluginSecret | quote }}
  {{- end }}
{{- end }}
