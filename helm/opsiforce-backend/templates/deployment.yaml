apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opsiforce-backend.fullname" . }}
  labels:
    app: {{ include "opsiforce-backend.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "opsiforce-backend.fullname" . }}
  template:
    metadata:
      annotations:
        rollme: {{ randAlphaNum 5 | quote }}
        karpenter.sh/do-not-disrupt: "true"
      labels:
        app: {{ include "opsiforce-backend.fullname" . }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Values.serviceAccountName }}
      containers:
        - name: opsiforce-backend
          lifecycle:
            preStop:
              exec:
                command: [ sh, -c, "sleep 30" ]
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "opsiforce-backend.fullname" . }}-config
            {{- if or .Values.config.openaiApiKey .Values.config.bifrostAdminUsername .Values.config.bifrostAdminPassword .Values.config.mailgunApiKey .Values.config.proxyControlToken .Values.config.oidcPluginSecret }}
            - secretRef:
                name: {{ include "opsiforce-backend.fullname" . }}-secret
            {{- end }}
          volumeMounts:
            - name: workspace-data
              mountPath: {{ .Values.config.storageMountPath | default "/workspace-data" }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.containerPort }}
          resources:
            requests:
              cpu: {{ .Values.backend.resources.requests.cpu }}
              memory: {{ .Values.backend.resources.requests.memory }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.backend.containerPort }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.backend.containerPort }}
      volumes:
        {{- if eq .Values.config.storageType "cephfs" }}
        - name: workspace-data
          persistentVolumeClaim:
            claimName: {{ .Values.config.cephfsPvcName }}
        {{- else }}
        - name: workspace-data
          hostPath:
            path: {{ .Values.config.storageMountPath }}
            type: DirectoryOrCreate
        {{- end }}
