replicaCount: 1

npmMigrationJob: true

backend:
  image:
    repository: ghcr.io/simadevelopment/opsiforce
    tag: backend
    pullPolicy: Always
  containerPort: 3001
  resources:
    requests:
      cpu: 50m
      memory: 300M

serviceAccountName: ""

config:
  databaseUrl: ""
  redisUrl: ""
  k8sNamespace: ""
  warmPoolSize: "1"
  agentImage: ""
  agentImagePullPolicy: "Always"
  agentPort: "4096"
  cephfsPvcName: "opsiforce-cephfs"
  storageType: "cephfs"
  storageHostPath: "/tmp/opsiforce-data"
  timeoutIdleMinutes: "30"
  platformVersion: ""
  agentResources: {}
  agentNodeSelector: {}
  agentTolerations: []
  openaiApiKey: ""
  agentAffinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: cfke.io/region
                operator: In
                values:
                  - northamerica
              - key: cfke.io/subregion
                operator: In
                values:
                  - east

imagePullSecrets:
  - name: ghcr-pull-secret
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80

resources: {}

livenessProbe:
  httpGet:
    path: /api/health
    port: http
readinessProbe:
  httpGet:
    path: /api/health
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: cfke.io/region
              operator: In
              values:
                - northamerica
            - key: cfke.io/subregion
              operator: In
              values:
                - east
