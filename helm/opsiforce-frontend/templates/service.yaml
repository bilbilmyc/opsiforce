apiVersion: v1
kind: Service
metadata:
  name: {{ include "opsiforce-frontend.fullname" . }}
  labels:
    app: {{ include "opsiforce-frontend.fullname" . }}
spec:
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.frontend.containerPort }}
  selector:
    app: {{ include "opsiforce-frontend.fullname" . }}
