apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opsiforce-bifrost
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bifrost
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 8080
          protocol: TCP
