service:
  type: ClusterIP

fullnameOverride: opsiforce-bifrost

image:
  tag: "v1.4.20"

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

storage:
  mode: postgres
  configStore:
    enabled: true
  logsStore:
    enabled: true

vectorStore:
  enabled: false
  type: none

postgresql:
  enabled: false
  external:
    enabled: true
    host: local-pg-postgresql.local.svc.cluster.local
    port: 5432
    user: admin
    database: bifrost
    sslMode: disable
    existingSecret: opsiforce-bifrost-postgres
    passwordKey: password

bifrost:
  encryptionKeySecret:
    name: opsiforce-bifrost-encryption
    key: key
  authConfig:
    isEnabled: true
    disableAuthOnInference: true
    existingSecret: opsiforce-bifrost-admin-auth
    usernameKey: username
    passwordKey: password
  client:
    enableLogging: true
    allowDirectKeys: false
  providers:
    openai:
      keys:
        - name: openai-primary
          value: env.OPENAI_API_KEY
          weight: 1
      network_config:
        default_request_timeout_in_seconds: 300
        max_retries: 2
        retry_backoff_initial_ms: 500
        retry_backoff_max_ms: 5000
        stream_idle_timeout_in_seconds: 600
    anthropic:
      keys:
        - name: anthropic-primary
          value: env.ANTHROPIC_API_KEY
          weight: 1
      network_config:
        default_request_timeout_in_seconds: 300
        max_retries: 2
        retry_backoff_initial_ms: 500
        retry_backoff_max_ms: 5000
        stream_idle_timeout_in_seconds: 600
  providerSecrets:
    openai:
      existingSecret: opsiforce-bifrost-provider-keys
      key: openai-api-key
      envVar: OPENAI_API_KEY
    anthropic:
      existingSecret: opsiforce-bifrost-provider-keys
      key: anthropic-api-key
      envVar: ANTHROPIC_API_KEY
  plugins:
    governance:
      enabled: true
    logging:
      enabled: true
